<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <h1>Fitness Tracker</h1>
            </div>
            <p class="header-subtitle">Track your workouts and stay motivated</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" style="color: #c084fc;" id="stat-exercises">0</div>
                <div class="stat-label" style="color: #c084fc;">Exercises</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #60a5fa;" id="stat-sets">0</div>
                <div class="stat-label" style="color: #60a5fa;">Sets</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #34d399;" id="stat-reps">0</div>
                <div class="stat-label" style="color: #34d399;">Reps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #fb923c;" id="stat-minutes">0</div>
                <div class="stat-label" style="color: #fb923c;">Minutes</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('workout')">Workout</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <!-- Workout Tab -->
        <div id="workout-tab" class="content active">
            <button class="btn-primary" id="start-exercise-btn" onclick="toggleExerciseList()">
                <span>➕</span>
                <span>Start Exercise</span>
            </button>

            <div id="exercises-list" class="exercises-grid hidden"></div>

            <div id="workout-panel" class="workout-panel hidden">
                <div class="workout-header">
                    <div class="workout-title">
                        <h2 id="current-exercise-name"></h2>
                        <p class="exercise-category" id="current-exercise-category"></p>
                    </div>
                    <button class="btn-close" onclick="cancelExercise()">✕</button>
                </div>

                <div class="timer-display">
                    <div class="timer-label">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 5px;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        Workout Duration
                    </div>
                    <div class="timer-time" id="timer-display">00:00:00</div>
                    <div class="timer-controls">
                        <button class="btn-timer btn-play" onclick="toggleTimer()">
                            <span id="timer-icon">▶</span>
                            <span id="timer-text">Pause</span>
                        </button>
                        <button class="btn-timer btn-reset" onclick="resetTimer()">
                            <span>↻</span>
                            <span>Reset</span>
                        </button>
                    </div>
                </div>

                <div class="set-input-group">
                    <label>Add Set (<span id="unit-label">reps</span>)</label>
                    <div class="input-row">
                        <input type="number" class="set-input" id="reps-input" placeholder="Enter amount...">
                        <button class="btn-add" onclick="addSet()">Add</button>
                    </div>
                </div>

                <div id="sets-container" class="sets-list hidden">
                    <h3>Sets Completed: <span id="sets-count">0</span></h3>
                    <div id="sets-list"></div>
                    <div class="total-display">
                        <div class="total-label">Total</div>
                        <div class="total-value"><span id="total-reps">0</span> <span id="total-unit">reps</span></div>
                    </div>
                </div>

                <button class="btn-complete" onclick="completeExercise()" disabled id="complete-btn">
                    Complete Exercise
                </button>
            </div>
        </div>

        <!-- History Tab -->
        <div id="history-tab" class="content">
            <div id="history-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
