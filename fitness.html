<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #581c87 50%, #0f172a 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .header-title h1 {
            font-size: 2.5rem;
        }

        .header-subtitle {
            color: #c084fc;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .tab-btn.active {
            background: #9333ea;
        }

        .tab-btn:not(.active) {
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn:hover {
            opacity: 0.9;
        }

        .content {
            display: none;
        }

        .content.active {
            display: block;
        }

        .btn-primary {
            width: 100%;
            padding: 20px;
            background: #9333ea;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            background: #7e22ce;
        }

        .exercises-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .exercise-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .exercise-card:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #9333ea;
        }

        .exercise-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .exercise-category {
            color: #c084fc;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .exercise-target {
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .workout-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 30px;
        }

        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .workout-title h2 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .timer-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
        }

        .timer-label {
            color: #c084fc;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .timer-time {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-timer {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-play {
            background: #9333ea;
        }

        .btn-play:hover {
            background: #7e22ce;
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .set-input-group {
            margin-bottom: 25px;
        }

        .set-input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .set-input {
            flex: 1;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .btn-add {
            padding: 15px 30px;
            background: #10b981;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add:hover {
            background: #059669;
        }

        .sets-list {
            margin-bottom: 25px;
        }

        .sets-list h3 {
            margin-bottom: 15px;
        }

        .set-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .set-value {
            font-weight: bold;
            color: #c084fc;
        }

        .total-display {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        .total-label {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .total-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #10b981;
        }

        .btn-complete {
            width: 100%;
            padding: 20px;
            background: #10b981;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-complete:hover {
            background: #059669;
        }

        .btn-complete:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        .btn-close {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .btn-close:hover {
            color: #dc2626;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .history-title h3 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 10px;
        }

        .history-stat {
            text-align: left;
        }

        .history-stat-label {
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .history-stat-value {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .history-date {
            color: #9ca3af;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
        }

        .empty-icon {
            font-size: 4rem;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .empty-text {
            color: #9ca3af;
        }

        .hidden {
            display: none;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
        }

        .btn-delete:hover {
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <h1>Fitness Tracker</h1>
            </div>
            <p class="header-subtitle">Track your workouts and stay motivated</p>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" style="color: #c084fc;" id="stat-exercises">0</div>
                <div class="stat-label" style="color: #c084fc;">Exercises</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #60a5fa;" id="stat-sets">0</div>
                <div class="stat-label" style="color: #60a5fa;">Sets</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #34d399;" id="stat-reps">0</div>
                <div class="stat-label" style="color: #34d399;">Reps</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #fb923c;" id="stat-minutes">0</div>
                <div class="stat-label" style="color: #fb923c;">Minutes</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('workout')">Workout</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
        </div>

        <!-- Workout Tab -->
        <div id="workout-tab" class="content active">
            <button class="btn-primary" id="start-exercise-btn" onclick="toggleExerciseList()">
                <span>➕</span>
                <span>Start Exercise</span>
            </button>

            <div id="exercises-list" class="exercises-grid hidden"></div>

            <div id="workout-panel" class="workout-panel hidden">
                <div class="workout-header">
                    <div class="workout-title">
                        <h2 id="current-exercise-name"></h2>
                        <p class="exercise-category" id="current-exercise-category"></p>
                    </div>
                    <button class="btn-close" onclick="cancelExercise()">✕</button>
                </div>

                <div class="timer-display">
                    <div class="timer-label">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 5px;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        Workout Duration
                    </div>
                    <div class="timer-time" id="timer-display">00:00:00</div>
                    <div class="timer-controls">
                        <button class="btn-timer btn-play" onclick="toggleTimer()">
                            <span id="timer-icon">⏸</span>
                            <span id="timer-text">Pause</span>
                        </button>
                        <button class="btn-timer btn-reset" onclick="resetTimer()">
                            <span>↻</span>
                            <span>Reset</span>
                        </button>
                    </div>
                </div>

                <div class="set-input-group">
                    <label>Add Set (<span id="unit-label">reps</span>)</label>
                    <div class="input-row">
                        <input type="number" class="set-input" id="reps-input" placeholder="Enter amount...">
                        <button class="btn-add" onclick="addSet()">Add</button>
                    </div>
                </div>

                <div id="sets-container" class="sets-list hidden">
                    <h3>Sets Completed: <span id="sets-count">0</span></h3>
                    <div id="sets-list"></div>
                    <div class="total-display">
                        <div class="total-label">Total</div>
                        <div class="total-value"><span id="total-reps">0</span> <span id="total-unit">reps</span></div>
                    </div>
                </div>

                <button class="btn-complete" onclick="completeExercise()" disabled id="complete-btn">
                    Complete Exercise
                </button>
            </div>
        </div>

        <!-- History Tab -->
        <div id="history-tab" class="content">
            <div id="history-content"></div>
        </div>
    </div>

    <script>
        const exercises = [
            { name: 'Push-ups', unit: 'reps', defaultTarget: 20, category: 'Upper Body' },
            { name: 'Squats', unit: 'reps', defaultTarget: 30, category: 'Lower Body' },
            { name: 'Plank', unit: 'seconds', defaultTarget: 60, category: 'Core' },
            { name: 'Jumping Jacks', unit: 'reps', defaultTarget: 50, category: 'Cardio' },
            { name: 'Lunges', unit: 'reps', defaultTarget: 20, category: 'Lower Body' },
            { name: 'Burpees', unit: 'reps', defaultTarget: 15, category: 'Full Body' },
            { name: 'Mountain Climbers', unit: 'reps', defaultTarget: 40, category: 'Core' },
            { name: 'Pull-ups', unit: 'reps', defaultTarget: 10, category: 'Upper Body' },
            { name: 'Sit-ups', unit: 'reps', defaultTarget: 30, category: 'Core' },
            { name: 'Running', unit: 'minutes', defaultTarget: 20, category: 'Cardio' }
        ];

        let workouts = [];
        let currentExercise = null;
        let timerInterval = null;
        let timerSeconds = 0;
        let isTimerRunning = true;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
            
            if (tab === 'history') {
                renderHistory();
            }
        }

        function toggleExerciseList() {
            const list = document.getElementById('exercises-list');
            const isHidden = list.classList.contains('hidden');
            
            if (isHidden) {
                renderExercises();
                list.classList.remove('hidden');
            } else {
                list.classList.add('hidden');
            }
        }

        function renderExercises() {
            const list = document.getElementById('exercises-list');
            list.innerHTML = exercises.map((ex, idx) => `
                <div class="exercise-card" onclick="startExercise(${idx})">
                    <div class="exercise-name">${ex.name}</div>
                    <div class="exercise-category">${ex.category}</div>
                    <div class="exercise-target">Target: ${ex.defaultTarget} ${ex.unit}</div>
                </div>
            `).join('');
        }

        function startExercise(idx) {
            const exercise = exercises[idx];
            currentExercise = {
                ...exercise,
                sets: [],
                startTime: Date.now()
            };

            document.getElementById('exercises-list').classList.add('hidden');
            document.getElementById('start-exercise-btn').classList.add('hidden');
            document.getElementById('workout-panel').classList.remove('hidden');
            
            document.getElementById('current-exercise-name').textContent = exercise.name;
            document.getElementById('current-exercise-category').textContent = exercise.category;
            document.getElementById('unit-label').textContent = exercise.unit;
            document.getElementById('total-unit').textContent = exercise.unit;
            
            timerSeconds = 0;
            isTimerRunning = true;
            startTimer();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isTimerRunning) {
                    timerSeconds++;
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const hrs = Math.floor(timerSeconds / 3600);
            const mins = Math.floor((timerSeconds % 3600) / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer-display').textContent = 
                `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function toggleTimer() {
            isTimerRunning = !isTimerRunning;
            document.getElementById('timer-icon').textContent = isTimerRunning ? '⏸' : '▶';
            document.getElementById('timer-text').textContent = isTimerRunning ? 'Pause' : 'Resume';
        }

        function resetTimer() {
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function addSet() {
            const input = document.getElementById('reps-input');
            const value = parseInt(input.value);
            
            if (!value || value <= 0) return;
            
                currentExercise.sets.push({
                    reps: value,
                    timestamp: Date.now()
                });
    
                input.value = '';
                updateSetsDisplay();
                document.getElementById('complete-btn').disabled = currentExercise.sets.length === 0;
            }
